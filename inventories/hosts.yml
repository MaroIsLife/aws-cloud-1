# Servers Ansible manages. Replace the IP after each instance start (it changes on every stop/start).
#   ansible_host                  the server's public IP
#   duckdns_subdomain             its name at duckdns.org -> https://wp.<name>.duckdns.org (one per server)
#   ansible_ssh_private_key_file  the SSH key; set under vars for every server, a host's own value wins
# Every host under webservers is deployed in parallel by `make deploy`.
# One server only: make deploy HOST=omanar
all:
  children:
    webservers:
      vars:
        ansible_ssh_private_key_file: ~/.ssh/cloud1-ec2.pem
      hosts:
        mougnou:
          ansible_host: CHANGE_ME_IP
          duckdns_subdomain: clouduno
        omanar:
          ansible_host: CHANGE_ME_IP
          duckdns_subdomain: clouduno2
