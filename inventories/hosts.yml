# Servers Ansible manages. Replace the IP after each instance start (it changes on every stop/start).
# duckdns_subdomain: this server's name at duckdns.org -> https://wp.<name>.duckdns.org
# To deploy on several servers in parallel, add another entry under hosts, each with its own
# IP and its own DuckDNS name, e.g.:
#   mougnou-2:
#     ansible_host: 1.2.3.4
#     duckdns_subdomain: clouduno2
all:
  children:
    webservers:
      hosts:
        mougnou-1:
          ansible_host: 15.188.57.254
          duckdns_subdomain: clouduno
