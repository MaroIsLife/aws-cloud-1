[defaults]
# Where the server list is
inventory = inventories/hosts.yml
# SSH login used on every server (the default user of Ubuntu AMIs on AWS)
remote_user = ubuntu
# Private key that matches the public key imported into AWS
private_key_file = ~/.ssh/id_ed25519
# Use the server's python3 without printing a warning about it
interpreter_python = auto_silent
# Password that unlocks inventories/group_vars/all/vault.yml (git-ignored, keep a backup!)
vault_password_file = .vault_pass

[ssh_connection]
# accept-new: a server never seen before (e.g. new IP after a restart) is trusted and saved in
# ~/.ssh/known_hosts automatically; a KNOWN server whose key changed is still refused.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
