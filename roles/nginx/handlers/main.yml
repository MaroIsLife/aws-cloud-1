# nginx fills its templates only at start, so a config change needs a restart
- name: Restart nginx
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    services: [nginx]
    state: restarted

# A new certificate only needs a reload: nginx re-reads it without dropping connections
- name: Reload nginx
  ansible.builtin.command:
    cmd: docker compose exec -T nginx nginx -s reload
    chdir: "{{ app_dir }}"
