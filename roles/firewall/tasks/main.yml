- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# Open the allowed ports BEFORE turning the firewall on, so our own SSH session isn't cut
- name: Allow SSH, HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: tcp
    comment: "{{ item.name }}"
  loop: "{{ firewall_allowed_ports }}"

- name: Block every other incoming connection
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow all outgoing connections (apt, Docker images, wp-cli downloads)
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Turn the firewall on (it stays on after reboots)
  community.general.ufw:
    state: enabled
