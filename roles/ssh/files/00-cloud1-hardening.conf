# sshd keeps the FIRST value it reads for each option, and the files in sshd_config.d/
# are read in alphabetical order, so this "00-" file wins over the others.

# Log in with an SSH key only: no passwords to guess or brute-force
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes

# Nobody logs in as root directly: use the ubuntu user, then sudo
PermitRootLogin no

# No graphical forwarding needed on a web server
X11Forwarding no
